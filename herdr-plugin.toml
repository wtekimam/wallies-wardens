id = "firstmate.pet"
name = "Firstmate Pet"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "One Mochi per Firstmate worker: mood, hunger and a session trophy row"
platforms = ["linux", "macos"]

# Once per Herdr start: pin the pet as a strip on top of the Firstmate tab, unless one is already open.
[[startup]]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/pet.py\" --pin"]

# The same pin, on demand (after closing the strip with q).
[[actions]]
id = "pin"
title = "Pin pet strip"
contexts = ["workspace"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/pet.py\" --pin"]

[[panes]]
id = "pet"
title = "Firstmate Pet"
placement = "popup"
width = 84
height = 24
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/pet.py\""]
